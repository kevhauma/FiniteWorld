# Pushing a tag vX.Y.Z builds the mod and publishes a GitHub release with the jar.
# The tag must match `version` in gradle.properties, so the jar name and the release agree.

name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: check the tag matches gradle.properties
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME does not match version=$version in gradle.properties"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle (validates the wrapper and caches ~/.gradle)
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "build/libs/finiteworld-$VERSION.jar" --title "Finite World $VERSION" --generate-notes --prerelease
